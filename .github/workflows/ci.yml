name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java 21 Temurin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Execute unit & integration tests
        run: ./gradlew test --no-daemon

      - name: Build shadow JAR packages
        run: ./gradlew shadowJar --no-daemon

      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sovereign-seasons-binaries
          path: |
            sovereign-seasons-core/build/libs/sovereign-seasons-core-*[0-9].jar
            sovereign-seasons-pantry/build/libs/sovereign-seasons-pantry-*[0-9].jar
            sovereign-seasons-logistics/build/libs/sovereign-seasons-logistics-*[0-9].jar
          if-no-files-found: error
          retention-days: 14
