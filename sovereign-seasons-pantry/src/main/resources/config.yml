# ==============================================================================
#                  SOVEREIGN SEASONS PANTRY - CONFIGURATION
# ==============================================================================

decay:
  # Activar la descomposición de alimentos.
  enabled: true

  # Ticks por día de juego (Vanilla usa 24000). Las vidas útiles se expresan en días de juego.
  ticks-per-day: 24000

  # Intervalo mínimo entre dos evaluaciones del mismo contenedor o inventario (6000 = un cuarto de día).
  # Las evaluaciones omitidas no pierden tiempo: se acumula hasta la siguiente.
  min-evaluation-interval-ticks: 6000

  # Redondeo de la fecha de caducidad. Alimentos obtenidos dentro de la misma "hora" de juego (1000 ticks)
  # comparten caducidad y se apilan entre sí.
  expiry-granularity-ticks: 1000

  # Cada cuántos ticks se revisa el inventario de los jugadores conectados (1200 = 1 minuto real).
  player-check-interval-ticks: 1200

  # Convertir los alimentos completamente podridos en carne podrida (ROTTEN_FLESH).
  spoil-to-rotten-flesh: true

  # Multiplicador de velocidad de descomposición según la banda de temperatura (servicio de temperatura del core).
  # 1.0 = ritmo normal, 0.5 = el doble de duración, 2.0 = la mitad de duración.
  band-rates:
    freezing: 0.25
    cold: 0.5
    mild: 1.0
    warm: 1.5
    hot: 2.0

stages:
  # Fracción de frescura restante por encima de la cual el alimento es "Fresco".
  fresh-above: 0.5
  # Por encima de este valor es "Rancio" (da Hambre breve al comerlo); por debajo, "Pudriéndose".
  stale-above: 0.15

# Vida útil en días de juego a ritmo normal. Los alimentos que no aparecen aquí no caducan nunca
# (p. ej. manzanas doradas, kelp seco, miel, carne podrida).
shelf-life-days:
  BEEF: 3
  PORKCHOP: 3
  CHICKEN: 2
  MUTTON: 3
  RABBIT: 2
  COD: 2
  SALMON: 2
  TROPICAL_FISH: 2
  COOKED_BEEF: 6
  COOKED_PORKCHOP: 6
  COOKED_CHICKEN: 5
  COOKED_MUTTON: 6
  COOKED_RABBIT: 5
  COOKED_COD: 4
  COOKED_SALMON: 4
  BREAD: 7
  COOKIE: 10
  PUMPKIN_PIE: 5
  BAKED_POTATO: 5
  MUSHROOM_STEW: 3
  BEETROOT_SOUP: 3
  RABBIT_STEW: 3
  SUSPICIOUS_STEW: 3
  APPLE: 10
  CARROT: 12
  POTATO: 14
  BEETROOT: 10
  MELON_SLICE: 3
  SWEET_BERRIES: 4
  GLOW_BERRIES: 5

cellar:
  # Bodegas subterráneas frías: sin luz del cielo y con techo sólido suficiente (o muy profundas).
  enabled: true

  # Multiplicador adicional de descomposición dentro de una bodega (no aplica con temperatura Calurosa).
  multiplier: 0.5

  # Bloques sólidos mínimos directamente encima del contenedor.
  min-roof-blocks: 3

  # Altura máxima a revisar hacia arriba para contar el techo.
  roof-scan-height: 16

  # Por debajo de esta altura Y basta con no recibir luz del cielo.
  deep-y: 40

  # "Nevera": bloques de hielo en este radio cúbico reducen aún más la descomposición.
  ice-radius: 2
  ice-multiplier: 0.5
  ice-materials:
    - ICE
    - PACKED_ICE
    - BLUE_ICE
    - SNOW_BLOCK

  # Caché espacial LRU de evaluaciones de bodega.
  cache-ttl-seconds: 60
  cache-max-size: 5000

preservation:
  # Los alimentos sacados de un ahumador (SMOKER) quedan "Ahumados" y se descomponen a este ritmo relativo.
  smoked-multiplier: 0.25

consumption:
  # Segundos de Hambre al comer un alimento Rancio (0 = desactivado).
  stale-hunger-seconds: 10
  # Segundos de Hambre II al comer un alimento Pudriéndose o Podrido (0 = desactivado).
  spoiling-hunger-seconds: 30

messages:
  prefix: "<gold><b>Pantry</b></gold> <gray>»</gray> "
