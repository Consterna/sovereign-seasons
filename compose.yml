services:
  # Servidor Paper nativo compilado desde el Dockerfile multi-stage
  paper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovereign-seasons-paper
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      - EULA=true
      - MEMORY=2G
      - MINECRAFT_VERSION=1.21.11
    volumes:
      - ./docker/data:/server/data
    stdin_open: true
    tty: true

  # Perfil alternativo para desarrollo rápido con itzg/minecraft-server
  itzg-paper:
    image: itzg/minecraft-server:java21
    container_name: sovereign-seasons-itzg
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      MEMORY: "2G"
      ENABLE_AUTOPAUSE: "FALSE"
    volumes:
      - ./docker/data-itzg:/data
      - ./sovereign-seasons-core/build/libs/sovereign-seasons-core-1.1.0.jar:/plugins/sovereign-seasons-core.jar:ro
      - ./sovereign-seasons-pantry/build/libs/sovereign-seasons-pantry-1.0.0.jar:/plugins/sovereign-seasons-pantry.jar:ro
    profiles:
      - itzg
    stdin_open: true
    tty: true
