# ==============================================================================
#                      SOVEREIGN SEASONS - CONFIGURATION
# ==============================================================================

calendar:
  # Duración de cada estación en días de juego de Minecraft (1 día = 24.000 ticks).
  # 7 días por estación equivale a un año completo de 28 días de juego.
  days-per-season: 7

  # Ticks por día (Vanilla Minecraft usa 24000). Modificar solo en servidores personalizados.
  ticks-per-day: 24000

  # Lista de mundos donde el calendario de estaciones está activo.
  # Si la lista está vacía, se aplica a todos los mundos de tipo NORMAL (Overworld).
  enabled-worlds:
    - world

crops:
  # Si está activado, los cultivos fuera de un invernadero se pausan en Invierno (no crecen).
  winter-growth-paused: true

  # Probabilidad de que un cultivo se marchite al intentar crecer en invierno sin invernadero.
  # Valor entre 0.0 y 1.0 (0.08 = 8% de probabilidad, rango recomendado 5% - 10%).
  winter-wither-chance: 0.08

  # Material en el que se convierte un cultivo marchito.
  wither-material: DEAD_BUSH

  # Reproducir efectos visuales y sonoros sutiles cuando un cultivo se marchita.
  play-wither-effects: true

  # Tipos de cultivos afectados por la congelación invernal.
  affected-crops:
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - NETHER_WART
    - COCOA
    - SWEET_BERRY_BUSH
    - MELON_STEM
    - PUMPKIN_STEM
    - ATTACHED_MELON_STEM
    - ATTACHED_PUMPKIN_STEM
    - TORCHFLOWER_CROP
    - PITCHER_CROP

  # Fertilidad estacional y clima ideal (fuera del invierno). Cada intento natural de crecer
  # tiene probabilidad = factor_estacion x factor_clima. Si falla, solo se omite ese paso: nunca muere.
  # Invernadero: ignora estación y clima. Bajo tierra (sin luz del cielo y Y <= underground-y): ignora la estación.
  seasonal-growth:
    enabled: true
    out-of-season-factor: 0.5   # Fuera de sus estaciones fértiles crece a la mitad de ritmo
    adjacent-band-factor: 0.6   # Una banda de temperatura por encima/debajo de su clima ideal
    far-band-factor: 0.3        # Dos o más bandas lejos de su clima ideal
    underground-y: 48
    # seasons: spring, summer, autumn, winter | bands: freezing, cold, mild, warm, hot
    profiles:
      WHEAT: { seasons: [spring, summer, autumn], bands: [mild, warm] }
      CARROTS: { seasons: [spring, autumn], bands: [cold, mild] }
      POTATOES: { seasons: [spring, autumn], bands: [cold, mild] }
      BEETROOTS: { seasons: [spring, autumn], bands: [cold, mild] }
      MELON_STEM: { seasons: [summer], bands: [warm, hot] }
      ATTACHED_MELON_STEM: { seasons: [summer], bands: [warm, hot] }
      PUMPKIN_STEM: { seasons: [summer, autumn], bands: [mild, warm] }
      ATTACHED_PUMPKIN_STEM: { seasons: [summer, autumn], bands: [mild, warm] }
      COCOA: { seasons: [spring, summer], bands: [warm, hot] }
      SWEET_BERRY_BUSH: { seasons: [summer, autumn], bands: [cold, mild] }
      SUGAR_CANE: { seasons: [spring, summer], bands: [warm, hot] }
      CACTUS: { seasons: [spring, summer], bands: [warm, hot] }
      TORCHFLOWER_CROP: { seasons: [spring, summer], bands: [mild, warm] }
      PITCHER_CROP: { seasons: [spring, summer], bands: [mild, warm] }

greenhouse:
  # Habilitar el sistema de detección de invernaderos.
  enabled: true

  # Exigir un techo de cristal vertical directamente sobre el cultivo.
  require-glass-ceiling: true

  # Altura máxima hacia arriba para buscar el techo de cristal.
  max-ceiling-height: 16

  # Materiales considerados cristal válido para el techo del invernadero.
  allowed-glass-materials:
    - GLASS
    - TINTED_GLASS
    - GLASS_PANE
    - WHITE_STAINED_GLASS
    - ORANGE_STAINED_GLASS
    - MAGENTA_STAINED_GLASS
    - LIGHT_BLUE_STAINED_GLASS
    - YELLOW_STAINED_GLASS
    - LIME_STAINED_GLASS
    - PINK_STAINED_GLASS
    - GRAY_STAINED_GLASS
    - LIGHT_GRAY_STAINED_GLASS
    - CYAN_STAINED_GLASS
    - PURPLE_STAINED_GLASS
    - BLUE_STAINED_GLASS
    - BROWN_STAINED_GLASS
    - GREEN_STAINED_GLASS
    - RED_STAINED_GLASS
    - BLACK_STAINED_GLASS
    - WHITE_STAINED_GLASS_PANE
    - ORANGE_STAINED_GLASS_PANE
    - MAGENTA_STAINED_GLASS_PANE
    - LIGHT_BLUE_STAINED_GLASS_PANE
    - YELLOW_STAINED_GLASS_PANE
    - LIME_STAINED_GLASS_PANE
    - PINK_STAINED_GLASS_PANE
    - GRAY_STAINED_GLASS_PANE
    - LIGHT_GRAY_STAINED_GLASS_PANE
    - CYAN_STAINED_GLASS_PANE
    - PURPLE_STAINED_GLASS_PANE
    - BLUE_STAINED_GLASS_PANE
    - BROWN_STAINED_GLASS_PANE
    - GREEN_STAINED_GLASS_PANE
    - RED_STAINED_GLASS_PANE
    - BLACK_STAINED_GLASS_PANE

  # Exigir una fuente de calor cercana para mantener la temperatura del invernadero.
  require-heat-source: true

  # Radio cúbico alrededor del cultivo para buscar fuentes de calor.
  heat-radius: 4

  # Materiales considerados fuentes de calor válidas (las fogatas y hornos deben estar encendidos).
  allowed-heat-sources:
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - FIRE
    - SOUL_FIRE
    - LAVA
    - LAVA_CAULDRON
    - MAGMA_BLOCK
    - TORCH
    - WALL_TORCH
    - SOUL_TORCH
    - SOUL_WALL_TORCH
    - LANTERN
    - SOUL_LANTERN
    - FURNACE
    - BLAST_FURNACE
    - SMOKER

  # Tiempo de vida (en segundos) de las evaluaciones en la caché espacial LRU.
  cache-ttl-seconds: 30

  # Cantidad máxima de bloques almacenados en la caché LRU para evitar uso excesivo de memoria.
  cache-max-size: 10000

  # Evitar que el agua se congele en hielo y que la nieve cubra los cultivos dentro de un invernadero.
  prevent-freeze-and-snow: true

temperature:
  # Habilitar el desfase estacional de temperatura (si es false solo se usa la temperatura del bioma).
  # Este servicio lo consumen otros módulos (p. ej. Pantry para la descomposición de alimentos).
  enabled: true

  # Conversión de la temperatura vanilla del bioma a grados Celsius: celsius = bioma * scale + offset.
  # Con los valores por defecto: Llanuras (0.8) = 15 °C, Desierto (2.0) = 45 °C, Taiga nevada (-0.5) = -17.5 °C.
  biome-scale: 25.0
  biome-offset: -5.0

  # Desfase en °C que aplica cada estación. Se interpola suavemente entre estaciones
  # (fases Temprana y Tardía) para evitar saltos bruscos al cambiar de estación.
  season-offsets:
    spring: 0.0
    summer: 8.0
    autumn: -2.0
    winter: -12.0

  # Umbrales (°C, estrictamente ascendentes) de las bandas de temperatura.
  # Helado < freezing-below <= Frío < cold-below <= Templado < mild-below <= Cálido < warm-below <= Caluroso
  bands:
    freezing-below: 0.0
    cold-below: 10.0
    mild-below: 20.0
    warm-below: 30.0

weather:
  # Probabilidad de aceptar que empiece a llover de forma natural en cada estación (1.0 = vanilla).
  # Los cambios de clima por comando (/weather) u otros plugins nunca se bloquean.
  enabled: true
  rain-chance:
    spring: 1.0
    summer: 0.5
    autumn: 1.0
    winter: 0.8

fauna:
  enabled: true
  # Probabilidad de gemelos al criar animales en primavera.
  spring-twin-chance: 0.25
  # En invierno, en zonas Frías o Heladas, los esqueletos naturales pueden aparecer como Stray.
  winter-stray-chance: 0.5
  # En verano, en zonas Calurosas, los zombis naturales pueden aparecer como Husk.
  summer-husk-chance: 0.5

comfort:
  # Efectos suaves de temperatura sobre el jugador (no aplica en creativo/espectador).
  enabled: true
  # Cambiar el intervalo requiere reiniciar el servidor (no se aplica con /season reload).
  interval-ticks: 20
  cold:
    # Banda Helada, a la intemperie, sin luz de bloque cercana (fuego/antorchas) y sin ninguna pieza de cuero.
    enabled: true
    # false = solo escarcha visual (por debajo del umbral de daño vanilla). true = daño por congelación vanilla.
    damage: false
    freeze-ticks: 120
    slowness: true
    warmth-block-light: 10
  heat:
    # Banda Calurosa, de día, bajo el sol directo, fuera del agua y sin Resistencia al fuego.
    enabled: true
    # Cansancio extra por segundo (4.0 = 1 punto de hambre). 0.05 = ~1 punto cada 80 s.
    exhaustion-per-second: 0.05
  # Segundos mínimos entre avisos en la barra de acción.
  message-cooldown-seconds: 60

interface:
  # Título y sonido al cambiar de estación.
  announce-season-change: true
  # Clic derecho con un reloj muestra fecha y temperatura.
  clock-shows-date: true
  # Frecuencia de actualización del HUD de /season hud (requiere reiniciar el servidor).
  hud-update-ticks: 100

messages:
  prefix: "<gold><b>SovereignSeasons</b></gold> <gray>»</gray> "
